# Replace chatbot.example.gov.ng and filesystem paths before enabling this file.
limit_req_zone $binary_remote_addr zone=chat_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=search_api:10m rate=60r/m;

upstream tambayi_nasarawa {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    server_name chatbot.example.gov.ng;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name chatbot.example.gov.ng;

    ssl_certificate /etc/letsencrypt/live/chatbot.example.gov.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatbot.example.gov.ng/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 2m;

    location /static/ {
        alias /srv/tambayi-nasarawa/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /srv/tambayi-nasarawa/media/;
        add_header X-Content-Type-Options nosniff;
    }

    location = /api/chat/message/ {
        limit_req zone=chat_api burst=10 nodelay;
        proxy_pass http://tambayi_nasarawa;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
    }

    location = /api/faq/search/ {
        limit_req zone=search_api burst=20 nodelay;
        proxy_pass http://tambayi_nasarawa;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://tambayi_nasarawa;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }
}
